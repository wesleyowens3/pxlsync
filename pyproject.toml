[project]
name = "pxlsync"
version = "0.1.0"
description = "PXLBOX media sync: codec check, version naming, organizing, FreeFileSync-powered sync"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7"]

[project.scripts]
pxlsync = "pxlsync.__main__:main"

[tool.setuptools.packages.find]
include = ["pxlsync*"]

[tool.setuptools.package-data]
pxlsync = ["assets/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
